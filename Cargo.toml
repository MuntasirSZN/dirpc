[package]
name = "dirpc"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[[bench]]
harness = false
name = "benchmarks"

[dependencies]
ahash = "0.8"
anyhow = { version = "1", features = ["backtrace"] }
bytes = "1"
clap = { version = "4", features = ["cargo", "derive", "env", "wrap_help"] }
clap-verbosity-flag = {
  version = "3",
  default-features = false,
  features = [
    "tracing",
  ]
}
compact_str = { version = "0.10", features = ["rkyv", "serde", "smallvec"] }
fst = "0.4"
jiff = "0.2"
memmap2 = "0.9"
papaya = "0.2"
redb = "4"
reqwest = {
  version = "0.13",
  features = [
    "hickory-dns",
    "json",
    "rustls",
    "socks",
  ]
}
rkyv = { version = "0.8", features = ["smallvec-1"] }
serde = { version = "1", features = ["derive"] }
serde_json = { package = "jzon-rs-compat", version = "0.3", features = ["fast-float", "simd"] }
simdutf8 = "0.1"
smallvec = {
  version = "1",
  features = [
    "const_generics",
    "serde",
    "union",
  ]
}
sockudo-ws = {
  version = "2.0",
  default-features = false,
  features = [
    "avx2",
    "avx512",
    "aws_lc_rs",
    "fastrand",
    "http2",
    "http3",
    "neon",
    "permessage-deflate",
    "rustls-platform-verifier",
    "simd",
    "tokio-runtime",
  ]
}
sysinfo = "0.39"
tokio = {
  version = "1.52",
  features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "parking_lot",
    "rt",
    "rt-multi-thread",
    "sync",
    "time",
  ]
}
tracing = "0.1"
tracing-subscriber = {
  version = "0.3",
  features = [
    "env-filter",
    "fmt",
    "parking_lot",
  ]
}

[dev-dependencies]
divan = { package = "codspeed-divan-compat", version = "5" }
tokio-test = "0.4"

[target.'cfg(not(target_env = "msvc"))'.dependencies]
mimalloc-safe = {
  version = "0.1",
  default-features = false,
  features = [
    "extended",
  ]
}

[target.'cfg(target_arch = "aarch64")'.dependencies]
mimalloc-safe = {
  version = "0.1",
  default-features = false,
  features = [
    "extended",
    "no_opt_arch",
  ]
}

[target.'cfg(target_endian = "big")'.dependencies]
rkyv = { version = "0.8", features = ["big_endian"] }

[target.'cfg(target_endian = "little")'.dependencies]
rkyv = { version = "0.8", features = ["little_endian"] }

[target.'cfg(target_env = "msvc")'.dependencies]
mimalloc-safe = {
  version = "0.1",
  default-features = false,
  features = [
    "extended",
    "no_opt_arch",
    "override",
  ]
}
